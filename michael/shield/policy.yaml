# Michael-V1 tool policy.
#
# risk: low  -> fast path, allowed with no deep checks (read-only tools)
# risk: high -> every "sink" argument must be traceable to the user, not to
#               untrusted content (emails, web pages, files)
#
# sinks: arguments that decide WHERE data or money goes.

trusted_contacts:
  - priya@acme-corp.example
  - rahul@acme-corp.example

tools:
  read_inbox:   { risk: low }
  read_file:    { risk: low }
  list_files:   { risk: low }
  web_fetch:    { risk: low }
  send_email:   { risk: high, sinks: [to, attachment] }
  make_payment: { risk: high, sinks: [account, amount] }

# Arguments that are allowed through if they match the trusted contact list.
allowlisted_sinks:
  to: trusted_contacts
